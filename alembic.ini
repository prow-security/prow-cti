# Alembic — see src/prow/db/migrations/env.py and docs/design/persister.md.

[alembic]
script_location = src/prow/db/migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os

# Async driver (asyncpg). Override with PROW_DATABASE_URL.
sqlalchemy.url = postgresql+asyncpg://prow:prow@127.0.0.1:5433/prow

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
