# Local Postgres 16 for migrations and integration tests.
#
# Host port 5433 (not 5432): on Windows/macOS, 5432 is often already taken by a local
# PostgreSQL install or another container. If Compose cannot bind, the container does
# not run; connecting to 127.0.0.1:5432 then hits that *other* server and you get
# "password authentication failed for user prow" even though this file sets prow/prow.
#
# Usage:
#   docker compose -f docker-compose.postgres.yml up -d
# DSN (note host port 5433):
#   postgresql+asyncpg://prow:prow@127.0.0.1:5433/prow

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prow
      POSTGRES_PASSWORD: prow
      POSTGRES_DB: prow
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prow -d prow"]
      interval: 3s
      timeout: 3s
      retries: 10
