[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prow"
version = "0.0.0"
description = "Open-source STIX 2.1-native cyber threat intelligence platform"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Prow Contributors" }]
dependencies = [
    "watchdog>=6.0.0",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "pydantic>=2",
    "pydantic-settings>=2.14.1",
    "sqlalchemy>=2",
    "asyncpg>=0.31.0",
    "alembic>=1.18.4",
    "httpx>=0.28.1",
    "structlog>=25.5.0",
    "typer>=0.25.1",
    "stix2>=3.0.2",
    "jsonschema>=4.26.0",
    "opentelemetry-api>=1.41.1",
    "opentelemetry-sdk>=1.41.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.12",
    "mypy>=2.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "import-linter>=2.11",
    "types-jsonschema>=4.26.0.20260508",
]
opensearch = []
nats = []

[project.scripts]
prow = "prow.cli:app"

[project.entry-points."prow.connectors"]
lifecycle_test = "prow.connector.testing.lifecycle_pkg.connector:LifecycleConnector"
hang_test = "prow.connector.testing.hang_pkg.connector:HangConnector"
crash_test = "prow.connector.testing.crash_pkg.connector:CrashConnector"
minimal_test = "prow.connector.testing.minimal_pkg.connector:MinimalConnector"
crash_setup_test = "prow.connector.testing.crash_setup_pkg.connector:CrashSetupConnector"
slow_health_test = "prow.connector.testing.slow_health_pkg.connector:SlowHealthConnector"
verbose_logger_test = "prow.connector.testing.verbose_logger_pkg.connector:VerboseLoggerConnector"
metric_emitter_test = "prow.connector.testing.metric_emitter_pkg.connector:MetricEmitterConnector"
stderr_chatty_test = "prow.connector.testing.stderr_chatty_pkg.connector:StderrChattyConnector"
secret_logger_test = "prow.connector.testing.secret_logger_pkg.connector:SecretLoggerConnector"
"cisa-kev" = "prow.connectors.kev:KevConnector"

[tool.hatch.build.targets.sdist]
include = ["src/prow", "README.md", "LICENSE", "NOTICE", "alembic.ini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: subprocess / integration tests that spawn real processes",
    "integration: tests that require Postgres (DATABASE_URL or PROW_DATABASE_URL)",
]
