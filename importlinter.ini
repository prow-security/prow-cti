[importlinter]
root_package = prow
include_external_packages = True

[importlinter:contract:connector-isolation]
name = Connector must not reach API, DB, or TAXII
type = forbidden
source_modules =
    prow.connector
forbidden_modules =
    prow.api
    prow.db
    prow.taxii

[importlinter:contract:connector-protocol-leaf]
name = Connector protocol stays independent of connector runtime internals
type = forbidden
source_modules =
    prow.connector.protocol
forbidden_modules =
    prow.connector.base
    prow.connector.context
    prow.connector.runner
    prow.connector.runtime
    prow.connector.sdk
    prow.connector.transports

[importlinter:contract:stix-leaf]
name = STIX package stays isolated from other prow modules
type = forbidden
source_modules =
    prow.stix
forbidden_modules =
    prow.api
    prow.bus
    prow.config
    prow.connector
    prow.db
    prow.enrich
    prow.taxii
    prow.telemetry
    prow.cli

[importlinter:contract:bus-boundary]
name = Bus must not depend on DB or API
type = forbidden
source_modules =
    prow.bus
forbidden_modules =
    prow.db
    prow.api

# NOTE(scaffold): prow.api must depend only on prow.config, prow.telemetry, prow.bus,
# and prow.db *interfaces* — import-linter forbids obvious wrong deps but cannot enforce
# interface-vs-implementation imports; review in code review until a finer contract exists.

[importlinter:contract:api-surface]
name = API layer imports only approved prow modules
type = forbidden
source_modules =
    prow.api
forbidden_modules =
    prow.connector
    prow.enrich
    prow.stix
    prow.taxii
    prow.cli

# The stix2 upstream library is the documented fork-risk dependency. Per
# ADR-0009 (2026-05-07 amendment) it must be reachable from exactly one
# place: prow.stix._stix2_adapter. Replacing upstream then becomes a
# rewrite of one module instead of a refactor across the codebase.
# The ignore_imports allow-list IS the boundary; growing it requires an
# explicit design conversation. Default unmatched_ignore_imports_alerting
# is in effect (error) so a future stale ignore entry cannot silently
# mask a removed dependency.
[importlinter:contract:stix-adapter-isolation]
name = stix2 is imported only by prow.stix._stix2_adapter
type = forbidden
source_modules =
    prow.stix
forbidden_modules =
    stix2
ignore_imports =
    prow.stix._stix2_adapter -> stix2
