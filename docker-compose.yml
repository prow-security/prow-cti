name: prow-cti

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prow
      POSTGRES_USER: prow
      POSTGRES_PASSWORD: prow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  prow:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      PROW_DATABASE_URL: postgresql+asyncpg://prow:prow@postgres:5432/prow
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
