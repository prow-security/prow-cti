[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prow-connector-urlhaus"
version = "0.1.0"
description = "abuse.ch URLhaus connector for prow"
requires-python = ">=3.12"

[project.entry-points."prow.connectors"]
"urlhaus" = "prow.connectors.urlhaus:UrlhausConnector"
